<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textos · CorBo</title><style>:root{--ink:#17211c;--muted:#657069;--paper:#f6f3ec;--card:#fff;--line:#d9ddd8;--accent:#315c48;--soft:#e7eee9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#173c2d;color:#fff}.bar{max-width:1250px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between}.bar a{color:#fff;text-decoration:none}.brand{font:700 22px Georgia,serif}.layout{max-width:1250px;margin:auto;padding:32px 24px 70px;display:grid;grid-template-columns:240px 1fr;gap:32px}h1{font:700 45px Georgia,serif;margin:0 0 6px}.muted{color:var(--muted)}aside{position:sticky;top:20px;align-self:start}.sections{background:white;border:1px solid var(--line);border-radius:9px;max-height:72vh;overflow:auto}.sections button{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:white;text-align:left;padding:10px 13px;cursor:pointer}.sections button.active{background:var(--soft);color:var(--accent);font-weight:700}.toolbar{display:flex;gap:8px;margin:20px 0}.toolbar button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:6px;cursor:pointer}.toolbar button.active{background:var(--accent);color:white;border-color:var(--accent)}.unit{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:18px 20px;margin:11px 0}.id{font-size:11px;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}.bororo{font:19px/1.65 Georgia,serif}.por{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;color:#49534d}.word{cursor:pointer;border-radius:3px}.word:hover{background:var(--soft);color:var(--accent)}.only-b .por{display:none}.only-p .bororo{display:none}.count{margin:8px 0 18px}.empty{padding:30px;border:1px dashed var(--line);color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static}.sections{max-height:220px}h1{font-size:38px}}</style></head><body><header><div class="bar"><div class="brand">CorBo · Textos</div><div><a href="./">Corpus</a> · <a href="forms.html">Formas</a></div></div></header><main class="layout"><aside><b>Coqueiro</b><p class="muted">Seções documentais preservadas pelos IDs do corpus.</p><div id="sections" class="sections"></div></aside><article><div class="muted">LEITOR DOCUMENTAL</div><h1 id="title">Coqueiro</h1><div id="count" class="count muted">Carregando…</div><div class="toolbar"><button class="active" data-mode="parallel">Bororo + Português</button><button data-mode="b">Bororo</button><button data-mode="p">Português</button></div><div id="units"></div></article></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[],current='S01';function section(id){let m=id.match(/-S(\d+)-/);return m?'S'+m[1]:null}function clickable(s){return esc(s).replace(/([\p{L}]+(?:[’'][\p{L}]+)?)/gu,'<span class="word">$1</span>')}function render(){let rows=data.filter(u=>section(u.id)===current);title.textContent=`Coqueiro · Seção ${Number(current.slice(1))}`;count.textContent=`${rows.length.toLocaleString('pt-BR')} unidade(s) nesta seção.`;units.innerHTML=rows.map(u=>`<section class="unit"><div class="id">${esc(u.id)}</div><div class="bororo">${clickable(u.b)}</div><div class="por">${esc(u.p||'—')}</div></section>`).join('')||'<div class="empty">Nenhuma unidade nesta seção.</div>';units.querySelectorAll('.word').forEach(w=>w.onclick=()=>location.href='word.html?form='+encodeURIComponent(w.textContent))}function nav(){let ss=[...new Set(data.map(u=>section(u.id)).filter(Boolean))].sort((a,b)=>Number(a.slice(1))-Number(b.slice(1)));sections.innerHTML=ss.map(s=>`<button data-s="${s}">Seção ${Number(s.slice(1))} <span class="muted">(${data.filter(u=>section(u.id)===s).length})</span></button>`).join('');sections.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.s;sections.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render();history.replaceState(null,'','?section='+current)});let first=sections.querySelector(`[data-s="${current}"]`)||sections.querySelector('button');if(first){current=first.dataset.s;first.classList.add('active')}}async function load(){try{let r=await fetch('./data/coqueiro-units.json');if(!r.ok)throw Error();data=await r.json();current=new URLSearchParams(location.search).get('section')||'S01';nav();render()}catch(e){count.textContent='Não foi possível carregar o índice de unidades.'}}document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');units.className=b.dataset.mode==='b'?'only-b':b.dataset.mode==='p'?'only-p':''});load()</script></body></html>
