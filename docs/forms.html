<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formas · CorBo</title><style>:root{--ink:#17211c;--muted:#657069;--paper:#f6f3ec;--line:#d9ddd8;--accent:#315c48}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui}header{background:#173c2d;color:#fff}.bar,main{max-width:1100px;margin:auto;padding:18px 24px}.bar{display:flex;justify-content:space-between}.bar a{color:#fff;text-decoration:none}.brand{font:700 22px Georgia,serif}main{padding-top:42px}h1{font:700 44px Georgia,serif;margin:0 0 8px}.muted{color:var(--muted)}input{width:100%;max-width:520px;padding:13px 15px;border:1px solid var(--line);border-radius:8px;background:white;font-size:16px;margin:15px 0 22px}table{width:100%;border-collapse:collapse;background:white;border:1px solid var(--line)}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}td:last-child,th:last-child{text-align:right}.form{font-weight:700;color:var(--accent);cursor:pointer}.summary{display:flex;gap:22px;margin:18px 0 28px;flex-wrap:wrap}.summary b{font:700 25px Georgia,serif}.summary span{color:var(--muted)}</style></head><body><header><div class="bar"><div class="brand">CorBo · Formas</div><a href="./">← Corpus</a></div></header><main><h1>Índice de formas</h1><p class="muted">Frequências calculadas sobre a camada revisada atualmente integrada do Coqueiro. Pontuação não é contada como token.</p><div class="summary"><div><b id="tokens">…</b> <span>tokens</span></div><div><b id="types">…</b> <span>formas distintas</span></div><div><b id="units">…</b> <span>unidades</span></div></div><input id="filter" placeholder="Filtrar formas…"><table><thead><tr><th>Forma</th><th>Frequência</th></tr></thead><tbody id="rows"></tbody></table></main><script>let D=[];fetch('./data/coqueiro-stats.json').then(r=>r.json()).then(d=>{D=d.top_forms;tokens.textContent=d.tokens.toLocaleString('pt-BR');types.textContent=d.types.toLocaleString('pt-BR');units.textContent=d.units.toLocaleString('pt-BR');render(D)});function render(a){rows.innerHTML=a.map(x=>`<tr><td class="form">${x.form}</td><td>${x.frequency.toLocaleString('pt-BR')}</td></tr>`).join('')}filter.oninput=()=>{let q=filter.value.toLowerCase();render(D.filter(x=>x.form.includes(q)))}</script></body></html>
