<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitor interlinear · CorBo</title><style>:root{--ink:#202624;--muted:#6d7672;--paper:#fbfcfb;--line:#e3e7e4;--accent:#527066;--soft:#eef3f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui}header{background:white;border-bottom:1px solid var(--line)}.bar,main{max-width:1100px;margin:auto;padding:18px 24px}.bar{display:flex;justify-content:space-between;gap:16px}a{color:var(--accent)}h1{font:700 43px Georgia,serif;margin:24px 0 8px}.muted{color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.controls button,.controls select{padding:9px 13px;border:1px solid var(--line);border-radius:6px;background:white;cursor:pointer}.controls button.active{background:var(--accent);color:white}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin:14px 0}.bor{font:24px/1.5 Georgia,serif}.translation{color:#53635a;margin:12px 0}.tokens{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}.token{min-width:95px;padding:10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:var(--soft);text-align:left}.token strong,.token small{display:block}.token small{color:#53635a}.detail{border-left:3px solid var(--accent);padding-left:15px;margin-top:20px}.analysis{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}.hide{display:none}</style></head><body><header><div class="bar"><b>CorBo · Leitor interlinear</b><nav><a href="aprendizagem.html">Aprendizagem</a> · <a href="ud.html">UD</a> · <a href="./">Início</a></nav></div></header><main><h1>Leitor interlinear</h1><p class="muted">Frases documentadas da camada CoNLL-U. A tradução portuguesa é da sentença, não de cada palavra isolada. Campos sem anotação são omitidos.</p><div class="controls"><button data-mode="reading">Leitura</button><button data-mode="learning" class="active">Aprendizagem</button><button data-mode="analysis">Análise</button><select id="choose" aria-label="Selecionar sentença"></select><button id="prev">Anterior</button><button id="next">Próxima</button></div><div id="status" class="muted">Carregando frases…</div><div id="view"></div></main><script src="./ud-pt.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),valid=x=>x!==undefined&&x!==null&&x!==''&&x!=='_',pt=window.CorBoUDpt;let D=[],idx=0,mode='learning';function tokenDetail(t){const vals=[['Lema',t.lemma],['Classe',pt.classe(t.upos)],['Morfologia',pt.tracos(t.feats)],['Classe detalhada',t.xpos],['Relação sintática',t.deprel]];document.getElementById('detail').innerHTML='<strong>'+esc(t.form)+'</strong>'+vals.filter(x=>valid(x[1])).map(([k,v])=>'<div><span class="muted">'+esc(k)+':</span> '+esc(v)+'</div>').join('')+'<a href="word.html?form='+encodeURIComponent(t.form)+'">Ver ocorrências</a>'}function render(){if(!D.length)return;const s=D[idx],T=s.tokens||[];choose.value=String(idx);status.textContent=(idx+1).toLocaleString('pt-BR')+' de '+D.length.toLocaleString('pt-BR')+' · '+(s.sent_id||'sem identificador');let html='<article class="card"><div class="bor">'+esc(s.text||T.map(t=>t.form).join(' '))+'</div>'+(valid(s.text_por)?'<div class="translation">'+esc(s.text_por)+'</div>':'');if(mode!=='reading'){html+='<div class="tokens">'+T.map((t,i)=>'<button class="token" data-i="'+i+'"><strong>'+esc(t.form)+'</strong>'+(valid(t.lemma)?'<small>'+esc(t.lemma)+'</small>':'')+(valid(t.upos)?'<small>'+esc(pt.classe(t.upos))+'</small>':'')+'</button>').join('')+'</div><div class="detail" id="detail">Selecione uma palavra para ver sua análise.</div>'}if(mode==='analysis'){html+='<div class="analysis"><h2>Anotação token a token</h2><table><thead><tr><th>Forma</th><th>Lema</th><th>Classe</th><th>Morfologia</th><th>HEAD</th><th>Relação</th></tr></thead><tbody>'+T.map(t=>'<tr><td>'+esc(t.form)+'</td><td>'+esc(valid(t.lemma)?t.lemma:'')+'</td><td>'+esc(pt.classe(t.upos))+'</td><td>'+esc(pt.tracos(t.feats))+'</td><td>'+esc(t.head)+'</td><td>'+esc(t.deprel)+'</td></tr>').join('')+'</tbody></table><p><a href="ud.html#'+encodeURIComponent(s.sent_id||'')+'">Ver árvore UD</a></p></div>'}view.innerHTML=html+'</article>';view.querySelectorAll('.token').forEach(b=>b.onclick=()=>tokenDetail(T[Number(b.dataset.i)]))}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});choose.onchange=()=>{idx=Number(choose.value);render()};prev.onclick=()=>{idx=(idx-1+D.length)%D.length;render()};next.onclick=()=>{idx=(idx+1)%D.length;render()};fetch('./data/ud-sentences.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{D=x.filter(s=>(s.tokens||[]).length);choose.innerHTML=D.map((s,i)=>'<option value="'+i+'">'+esc(s.sent_id||'Frase '+(i+1))+' · '+esc((s.text||'').slice(0,65))+'</option>').join('');if(!D.length)throw Error();render()}).catch(()=>status.textContent='Não foi possível carregar as sentenças anotadas.')</script></body></html>
