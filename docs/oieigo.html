<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oiegos · CorBo</title><style>:root{--ink:#202624;--muted:#6d7672;--paper:#fbfcfb;--line:#e3e7e4;--accent:#527066;--soft:#eef3f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1100px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between}.bar a,a{color:var(--accent);text-decoration:none}.brand{font:700 22px Georgia,serif}main{max-width:1000px;margin:auto;padding:48px 24px 80px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}h1{font:600 48px Georgia,serif;margin:5px 0 8px}.chooser{margin:24px 0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:9px}.chooser select{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff}.meta{color:var(--muted);margin-top:8px}.intro{color:var(--muted);margin-bottom:30px}.unit{display:grid;grid-template-columns:52px 1fr 1fr;gap:20px;border-top:1px solid var(--line);padding:18px 0}.num{font:12px ui-monospace,monospace;color:var(--muted)}.bor{font:18px/1.6 Georgia,serif}.word{cursor:pointer;border-radius:3px}.word:hover{background:var(--soft);color:var(--accent)}.por{color:#56605c}.comment{margin-top:42px;padding:24px;border:1px solid var(--line);border-radius:9px;background:white}.comment h2{font:600 25px Georgia,serif;margin:0 0 10px}.comment p{white-space:pre-line;margin:0;color:#56605c}@media(max-width:700px){.unit{grid-template-columns:35px 1fr}.por{grid-column:2}}</style></head><body><header><div class="bar"><div class="brand">CorBo</div><nav><a href="./">Início</a> · <a href="catalogo.html">Textos</a> · <a href="about.html">Sobre</a></nav></div></header><main><div class="eyebrow">COLEÇÃO · OIEIGO</div><h1>Oiegos</h1><p class="intro">Coleção documental de Oiegos. Cada texto é mantido como documento independente; quando há tradução, ela aparece em paralelo. Narrativas explicativas e cantos são identificados separadamente.</p><div class="chooser"><select id="textsel"></select><div class="meta" id="meta"></div></div><div id="units">Carregando…</div><section class="comment" id="commentbox"><h2>Comentário documental</h2><p id="comment"></p></section></main><script>
const base='https://raw.githubusercontent.com/LanguageStructure/Bororo-Corpus/main/CorBo_vNext/texts/oieigo/';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function clickable(s){return esc(s).replace(/([\\p{L}]+(?:[’'][\\p{L}]+)?)/gu,'<span class="word">$1</span>')}
function parse(t){let lines=t.trim().split(/\r?\n/),head=lines.shift().split('\t');return lines.map(l=>{let v=l.split('\t'),o={};head.forEach((h,i)=>o[h]=v[i]||'');return o})}
let manifest=[];
async function show(slug){let m=manifest.find(x=>x.slug===slug);if(!m)return;meta.textContent=[m.type,m.place_date,m.units+' unidades',m.note].filter(Boolean).join(' · ');let r=await fetch(base+m.file);let rows=parse(await r.text());units.innerHTML=rows.map((x,i)=>'<section class="unit" id="'+esc(x.id)+'"><div class="num">'+(i+1)+'</div><div class="bor">'+clickable(x.reviewed||x.source)+'</div><div class="por">'+esc(x.portuguese_reviewed||x.portuguese)+'</div></section>').join('');units.querySelectorAll('.word').forEach(w=>w.onclick=()=>location.href='word.html?form='+encodeURIComponent(w.textContent));commentbox.hidden=slug!=='mito-explicacao';if(!commentbox.hidden){let cr=await fetch(base+'comment.txt');comment.textContent=await cr.text()}}
async function load(){try{let r=await fetch(base+'manifest.tsv');manifest=parse(await r.text());textsel.innerHTML=manifest.map(m=>'<option value="'+esc(m.slug)+'">'+esc(m.title)+'</option>').join('');textsel.onchange=()=>show(textsel.value);show(manifest[0].slug)}catch(e){units.textContent='Não foi possível carregar a coleção.'}}load();
</script></body></html>
