<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oieigo Jiwu Bakaru · CorBo</title><style>:root{--ink:#202624;--muted:#6d7672;--paper:#fbfcfb;--line:#e3e7e4;--accent:#527066;--soft:#eef3f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.bar{max-width:1100px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between}.bar a,a{color:var(--accent);text-decoration:none}.brand{font:700 22px Georgia,serif}main{max-width:1000px;margin:auto;padding:48px 24px 80px}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--accent);font-weight:700}h1{font:600 48px Georgia,serif;margin:5px 0 8px}.intro{color:var(--muted);margin-bottom:30px}.unit{display:grid;grid-template-columns:52px 1fr 1fr;gap:20px;border-top:1px solid var(--line);padding:18px 0}.num{font:12px ui-monospace,monospace;color:var(--muted)}.bor{font:18px/1.6 Georgia,serif}.por{color:#56605c}.comment{margin-top:42px;padding:24px;border:1px solid var(--line);border-radius:9px;background:white}.comment h2{font:600 25px Georgia,serif;margin:0 0 10px}.comment p{white-space:pre-line;margin:0;color:#56605c}@media(max-width:700px){.unit{grid-template-columns:35px 1fr}.por{grid-column:2}}</style></head><body><header><div class="bar"><div class="brand">CorBo</div><nav><a href="./">Início</a> · <a href="catalogo.html">Textos</a> · <a href="about.html">Sobre</a></nav></div></header><main><div class="eyebrow">NARRATIVA · TEXTO PARALELO</div><h1>Oieigo Jiwu Bakaru</h1><p class="intro">Texto Bororo e tradução portuguesa em unidades paralelas. A fonte documental é preservada separadamente da revisão editorial.</p><div id="units">Carregando…</div><section class="comment"><h2>Comentário</h2><p id="comment">Carregando…</p></section></main><script>const base='https://raw.githubusercontent.com/LanguageStructure/Bororo-Corpus/main/CorBo_vNext/texts/oieigo/';const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function parse(t){let lines=t.trim().split(/\r?\n/),head=lines.shift().split('\t');return lines.map(l=>{let v=l.split('\t'),o={};head.forEach((h,i)=>o[h]=v[i]||'');return o})}async function load(){try{let [tr,cr]=await Promise.all([fetch(base+'oieigo_parallel.tsv'),fetch(base+'comment.txt')]);let rows=parse(await tr.text());units.innerHTML=rows.map((r,i)=>'<section class="unit" id="'+esc(r.id)+'"><div class="num">'+(i+1)+'</div><div class="bor">'+esc(r.reviewed||r.source)+'</div><div class="por">'+esc(r.portuguese_reviewed||r.portuguese)+'</div></section>').join('');comment.textContent=await cr.text()}catch(e){units.textContent='Não foi possível carregar o texto.';comment.textContent=''}}load();</script></body></html>
