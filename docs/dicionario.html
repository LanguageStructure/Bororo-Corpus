<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dicionário · CorBo</title><style>body{font:16px/1.6 system-ui;background:#fbfcfb;color:#202624;margin:0}header,main{padding:20px max(20px,calc((100vw - 1050px)/2))}header{background:white;border-bottom:1px solid #ddd}a{color:#42685a}input{padding:12px;width:100%;max-width:650px;font:inherit;border:1px solid #bbb;border-radius:8px}article{background:white;border:1px solid #ddd;border-radius:8px;margin:14px 0;padding:16px}h1,h2{font-family:Georgia,serif}.muted{color:#68736e}dt{font-weight:600}dd{margin:0 0 8px}</style><header><a href="./">CorBo</a> · <a href="aprendizagem.html">Aprendizagem</a> · <a href="catalogo.html">Textos</a></header><main><h1>Dicionário Bororo</h1><p class="muted">Consulta às entradas lexicográficas publicadas a partir da planilha mantida no Google Drive. O documento original não integra este repositório. As correspondências com formas do corpus devem ser verificadas.</p><input id="q" type="search" placeholder="Buscar entrada, lema ou definição" aria-label="Buscar no dicionário"><p id="status" class="muted">Carregando índice…</p><div id="results"></div></main><script>
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const q=document.getElementById('q'),results=document.getElementById('results'),status=document.getElementById('status');let entries=[];
function render(){const term=norm(q.value.trim());results.replaceChildren();if(!term){status.textContent=entries.length+' entradas disponíveis. Digite uma palavra para consultar.';return}const matches=entries.filter(x=>[x.entry,x.lemma_key,x.definition].some(v=>norm(v).includes(term))).slice(0,100);status.textContent=matches.length+' resultado(s) exibido(s)'+(matches.length===100?' (limite de exibição)':'');for(const x of matches){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=x.entry;article.append(title);for(const [label,key] of [['IPA','ipa'],['Classe','pos'],['Definição','definition'],['Exemplo','example_sent'],['Nome científico','scientific_name'],['Observação','comment']]){if(!x[key])continue;const p=document.createElement('p');const b=document.createElement('strong');b.textContent=label+': ';p.append(b,document.createTextNode(x[key]));article.append(p)}results.append(article)}}
q.addEventListener('input',render);const p=new URLSearchParams(location.search);q.value=p.get('lemma')||p.get('form')||'';fetch('./data/dicionario-bororo-publico.json').then(r=>{if(!r.ok)throw Error('Índice público ainda não publicado');return r.json()}).then(d=>{entries=d.entries||[];render()}).catch(e=>{status.textContent=e.message+'. O dicionário original permanece no Drive.'});
</script></html>
