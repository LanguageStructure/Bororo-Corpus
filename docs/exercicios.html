<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercícios · Aprendizagem CorBo</title><style>:root{--ink:#202624;--muted:#6d7672;--paper:#fbfcfb;--line:#e3e7e4;--accent:#527066;--soft:#eef3f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui}header{background:white;border-bottom:1px solid var(--line)}.bar,main{max-width:950px;margin:auto;padding:20px 25px}.bar{display:flex;justify-content:space-between;gap:15px}a{color:var(--accent)}h1{font:700 45px Georgia,serif;margin:24px 0 8px}.muted{color:var(--muted)}.tabs,.actions{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}button,select{background:white;border:1px solid #ccd8d1;border-radius:7px;padding:10px 14px;cursor:pointer;font:inherit}button.active{background:var(--accent);color:white}.card{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;margin:18px 0}.bor{font:25px/1.6 Georgia,serif}.option{display:block;width:100%;text-align:left;margin:9px 0}.option:disabled{cursor:default}.correct{border-color:#287c51;background:#e8f5ec}.wrong{border-color:#a44;background:#fff0f0}.feedback{font-weight:600;margin-top:16px}.small{font-size:13px}.card strong{color:#30473b}</style></head><body><header><div class="bar"><strong>CorBo · Aprendizagem</strong><nav><a href="aprendizagem.html">Aprendizagem</a> · <a href="interlinear.html">Leitor interlinear</a> · <a href="./">Início</a></nav></div></header><main><h1>Exercícios</h1><p class="muted">Atividades construídas com sentenças e anotações CoNLL-U. As alternativas incorretas são outras traduções documentadas, não traduções inventadas. A classe gramatical corresponde à anotação da ocorrência.</p><div class="tabs"><button data-kind="translation" class="active">Tradução</button><button data-kind="class">Classe gramatical</button><button data-kind="cards">Cartões de estudo</button></div><div class="actions"><button id="new">Próxima atividade</button><span id="score" class="muted"></span></div><div id="status" class="muted">Carregando dados…</div><div id="area"></div></main><script src="./ud-pt.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),valid=x=>typeof x==='string'&&x.trim()&&x!=='_',pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>a.sort(()=>Math.random()-.5),pt=window.CorBoUDpt;let D=[],kind='translation',seen=new Set(),right=0,total=0,active=null;function eligible(s){return valid(s.text)&&valid(s.text_por)&&s.text_por.trim().length>5}function source(s){return '<p class="small muted">Fonte: sentença anotada '+esc(s.sent_id||'')+'</p>'}function next(){if(!D.length)return;const candidates=kind==='translation'?D.filter(eligible):D.filter(s=>(s.tokens||[]).some(t=>valid(t.form)&&valid(t.upos)&&t.upos!=='PUNCT'));if(!candidates.length){area.innerHTML='<div class="card">Não há dados anotados suficientes para esta atividade.</div>';return}if(seen.size>=candidates.length)seen.clear();let choices=candidates.filter(s=>!seen.has(s.sent_id||D.indexOf(s)));let s=pick(choices.length?choices:candidates);seen.add(s.sent_id||D.indexOf(s));active=s;let h='<div class="card">';if(kind==='translation'){const other=shuffle([...new Set(D.filter(eligible).map(x=>x.text_por.trim()).filter(x=>x!==s.text_por.trim()))]).slice(0,3);if(other.length<3){area.innerHTML='<div class="card">Não há traduções distintas suficientes para formar quatro alternativas.</div>';return}const opts=shuffle([s.text_por.trim(),...other]);h+='<h2>Qual tradução corresponde à frase?</h2><div class="bor">'+esc(s.text)+'</div>'+opts.map((v,i)=>'<button class="option" data-correct="'+(v===s.text_por.trim())+'">'+esc(v)+'</button>').join('')}else{const t=pick(s.tokens.filter(t=>valid(t.form)&&valid(t.upos)&&t.upos!=='PUNCT'));active={s,t};if(kind==='class'){const classes=[...new Set(D.flatMap(x=>(x.tokens||[]).map(t=>t.upos)).filter(x=>valid(x)&&x!=='PUNCT'&&x!==t.upos))];const opts=shuffle([t.upos,...shuffle(classes).slice(0,3)]);h+='<h2>Qual é a classe anotada para a palavra destacada?</h2><p class="bor">'+esc(s.text)+'</p><p>Palavra: <strong>'+esc(t.form)+'</strong></p>'+opts.map(v=>'<button class="option" data-correct="'+(v===t.upos)+'">'+esc(pt.classe(v))+'</button>').join('')}else{h+='<h2>Cartão de estudo</h2><p class="bor">'+esc(t.form)+'</p><p class="muted">Tente recordar o lema e a classe gramatical anotados nesta ocorrência.</p><button id="reveal">Revelar análise</button><div id="answer" hidden><p><strong>Lema:</strong> '+esc(valid(t.lemma)?t.lemma:'não anotado')+'</p><p><strong>Classe:</strong> '+esc(pt.classe(t.upos))+'</p><p><strong>Frase:</strong> '+esc(s.text||'')+'</p>'+(valid(s.text_por)?'<p><strong>Tradução da frase:</strong> '+esc(s.text_por)+'</p>':'')+'</div>'}}h+=source(s)+'<div class="feedback" id="feedback" aria-live="polite"></div></div>';area.innerHTML=h;if(kind==='cards'){reveal.onclick=()=>{answer.hidden=false;reveal.disabled=true}}else area.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const ok=b.dataset.correct==='true';total++;if(ok)right++;score.textContent=right+' / '+total+' respostas corretas';area.querySelectorAll('.option').forEach(x=>{x.disabled=true;if(x.dataset.correct==='true')x.classList.add('correct');else if(x===b)x.classList.add('wrong')});feedback.textContent=ok?'Correto.':'A alternativa correta está destacada.'})}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;seen.clear();document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));next()});document.getElementById('new').onclick=next;fetch('./data/ud-sentences.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{D=x.filter(s=>(s.tokens||[]).length);status.textContent=D.length.toLocaleString('pt-BR')+' sentenças disponíveis para seleção; atividades dependem das anotações de cada frase.';next()}).catch(()=>status.textContent='Não foi possível carregar as sentenças do CoNLL-U.')</script></body></html>
