<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textos bíblicos · CorBo</title><style>:root{font-family:system-ui,sans-serif;color:#17211c;background:#f6f3ec}*{box-sizing:border-box}body{margin:0}header{background:#173c2d;color:#fff;padding:18px 24px}header a{color:#fff}.wrap{max-width:1050px;margin:auto;padding:36px 24px}h1,h2{font-family:Georgia,serif}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{padding:9px 13px;border:1px solid #ccd2ce;background:#fff;border-radius:7px;cursor:pointer}.tabs button.on{background:#173c2d;color:#fff}.unit{background:#fff;border:1px solid #d9ddd8;border-radius:8px;padding:18px;margin:12px 0}.id{font:12px ui-monospace,monospace;color:#657069}.bor{font:18px/1.65 Georgia,serif;margin:8px 0}.provisional{display:inline-block;font-size:11px;background:#fff2c6;padding:3px 7px;border-radius:999px}.reviewed{background:#e7eee9}.pt{border-top:1px solid #eee;margin-top:12px;padding-top:10px;color:#505a54}.notice{background:#e7eee9;border-left:3px solid #315c48;padding:12px 15px}</style></head><body><header><a href="./">CorBo</a> · Textos bíblicos</header><main class="wrap"><h1>Textos bíblicos</h1><p class="notice">Coleção separada do corpus documental principal. A transcrição-fonte é preservada; enquanto uma unidade não tiver revisão editorial, ela é marcada como provisória.</p><div class="tabs" id="tabs"></div><div id="status">Carregando…</div><div id="units"></div></main><script>const $=x=>document.getElementById(x),esc=s=>{let d=document.createElement('div');d.textContent=s||'';return d.innerHTML};let data=[],book='';function render(){let rows=data.filter(x=>x.collection===book);$('units').innerHTML=rows.map(u=>`<article class=unit id="${esc(u.id)}"><div class=id>${esc(u.id)}</div><span class="provisional ${u.reviewed?'reviewed':''}">${u.reviewed?'revisada':'provisória'}</span><div class=bor>${esc(u.b)}</div>${u.p?`<div class=pt>${esc(u.p)}</div>`:''}</article>`).join('');$('status').textContent=`${rows.length} unidades · ${rows.filter(x=>x.reviewed).length} revisadas`;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.book===book))}fetch('data/biblia-units.json').then(r=>r.json()).then(x=>{data=x;let books=[...new Set(x.map(u=>u.collection))];book=books[0]||'';$('tabs').innerHTML=books.map(b=>`<button data-book="${esc(b)}">${esc(b)}</button>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{book=b.dataset.book;render()});render()}).catch(e=>$('status').textContent='Os dados ainda estão sendo gerados.');</script></body></html>
