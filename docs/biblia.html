<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Textos bíblicos · CorBo</title><style>:root{font-family:system-ui,sans-serif;color:#202624;background:#fbfcfb}*{box-sizing:border-box}body{margin:0}header{background:#fff;color:#202624;padding:18px 24px;border-bottom:1px solid #e3e7e4}header a{color:#527066}.wrap{max-width:1050px;margin:auto;padding:36px 24px}h1,h2{font-family:Georgia,serif}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button{padding:9px 13px;border:1px solid #dce2de;background:#fff;border-radius:7px;cursor:pointer}.tabs button.on{background:#3f5f55;color:#fff}.unit{background:#fff;border:1px solid #e3e7e4;border-radius:8px;padding:18px;margin:12px 0}.id{font:12px ui-monospace,monospace;color:#6d7672}.bor{font:18px/1.65 Georgia,serif;margin:8px 0}.word{cursor:pointer;border-radius:3px}.word:hover{background:var(--soft);color:var(--accent)}.provisional{display:inline-block;font-size:11px;background:#fff2c6;padding:3px 7px;border-radius:999px}.reviewed{background:#eef3f1}.pt{border-top:1px solid #eee;margin-top:12px;padding-top:10px;color:#59635f}.notice{background:#eef3f1;border-left:3px solid #527066;padding:12px 15px}</style></head><body><header><a href="./">Corpus</a> · <a href="texts.html">Textos</a> · <a href="forms.html">Formas</a> · <a href="morphemes.html">Morfemas</a> · <a href="relations.html">Relações</a> · <a href="statistics.html">Estatísticas</a> · Textos bíblicos</header><main class="wrap"><h1>Textos bíblicos</h1><p class="notice">Coleção separada do corpus documental principal. A transcrição-fonte é preservada; enquanto uma unidade não tiver revisão editorial, ela é marcada como provisória.</p><div class="tabs" id="tabs"></div><div id="status">Carregando…</div><div id="units"></div></main><script>const $=x=>document.getElementById(x),esc=s=>{let d=document.createElement('div');d.textContent=s||'';return d.innerHTML};function clickable(s){return esc(s).replace(/([\p{L}]+(?:[’'][\p{L}]+)?)/gu,'<span class="word">$1</span>')}let data=[],book='';function render(scroll=false){let rows=data.filter(x=>x.collection===book);$('units').innerHTML=rows.map(u=>`<article class=unit id="${esc(u.id)}"><div class=id>${esc(u.id)}</div><span class="provisional ${u.reviewed?'reviewed':''}">${u.reviewed?'revisada':'provisória'}</span><div class=bor>${clickable(u.b)}</div>${u.p?`<div class=pt>${esc(u.p)}</div>`:''}</article>`).join('');$('status').textContent=`${rows.length} unidades · ${rows.filter(x=>x.reviewed).length} revisadas`;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.book===book));if(scroll&&location.hash){let id=decodeURIComponent(location.hash.slice(1)),el=document.getElementById(id);if(el)requestAnimationFrame(()=>el.scrollIntoView({block:'start'}))}}fetch('data/biblia-units.json').then(r=>r.json()).then(x=>{data=x;let books=[...new Set(x.map(u=>u.collection))];let hash=decodeURIComponent(location.hash.slice(1)),target=x.find(u=>u.id===hash);book=target?target.collection:(books[0]||'');$('tabs').innerHTML=books.map(b=>`<button data-book="${esc(b)}">${esc(b)}</button>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{book=b.dataset.book;history.replaceState(null,'',location.pathname+location.search);render()});render(true);addEventListener('hashchange',()=>{let id=decodeURIComponent(location.hash.slice(1)),u=data.find(x=>x.id===id);if(u){book=u.collection;render(true)}})}).catch(e=>$('status').textContent='Os dados ainda estão sendo gerados.');</script></body></html>
