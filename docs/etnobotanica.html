<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etnobotânica · CorBo</title><style>:root{--ink:#202624;--muted:#6d7672;--paper:#fbfcfb;--line:#e3e7e4;--accent:#527066;--soft:#eef3f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,-apple-system,sans-serif}header{background:#fff;border-bottom:1px solid var(--line)}.bar,main{max-width:1050px;margin:auto;padding:20px 28px}.bar{display:flex;justify-content:space-between}.bar a,a{color:var(--accent)}h1,h2{font-family:Georgia,serif}h1{font-size:48px;margin:28px 0 8px}.entry{padding:25px 0;border-top:1px solid var(--line)}.entry h2{margin:0 0 10px;font-size:25px}.bororo{font-size:18px}.word{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--accent);cursor:pointer}.word:hover{background:var(--soft)}.meta{color:var(--muted);font-size:12px}.muted{color:var(--muted)}</style></head><body><header><div class="bar"><strong>CorBo · Etnobotânica</strong><nav><a href="./">Início</a> · <a href="catalogo.html">Textos</a> · <a href="search.html">Busca</a></nav></div></header><main><div class="muted">COLEÇÃO</div><h1>Etnobotânica</h1><p class="muted">Nomes e descrições em Bororo. Clique em qualquer palavra para consultar a forma no corpus.</p><div id="entries">Carregando…</div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const re=/[\p{L}]+(?:['’][\p{L}]+)?/gu;
function clickable(s){let out='',last=0;for(const m of String(s||'').matchAll(re)){out+=esc(s.slice(last,m.index));out+=`<a class="word" href="word.html?form=${encodeURIComponent(m[0])}">${esc(m[0])}</a>`;last=m.index+m[0].length}return out+esc(s.slice(last))}
fetch('./data/etnobotanica-units.json').then(r=>r.json()).then(rows=>{entries.innerHTML=rows.map(x=>`<article class="entry" id="${esc(x.id)}"><h2>${clickable(x.name)}</h2><div class="bororo">${clickable(x.b)}</div><div class="meta">${esc(x.id)}</div></article>`).join('')||'<p>Nenhuma entrada disponível.</p>'}).catch(()=>entries.innerHTML='<p>Não foi possível carregar a coleção.</p>');
</script></body></html>
