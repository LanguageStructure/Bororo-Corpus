<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Árvores UD · CorBo</title><style>
:root{--ink:#202624;--muted:#6d7672;--paper:#fbfcfb;--line:#e3e7e4;--accent:#527066;--soft:#eef3f1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui}header{background:#fff;border-bottom:1px solid var(--line)}.bar,main{max-width:1250px;margin:auto;padding:18px 24px}.bar{display:flex;justify-content:space-between;gap:20px}.bar a{color:var(--accent);text-decoration:none}h1{font:700 45px Georgia,serif;margin:20px 0 5px}.muted{color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tools input{flex:1;min-width:260px;padding:11px;border:1px solid var(--line);border-radius:7px}.sentence{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px;margin:14px 0}.text{font:20px Georgia,serif;margin:6px 0 14px}.graph{overflow-x:auto;padding:8px 0}.tree{position:relative;min-width:max-content;padding-top:12px}.arcs{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}.tokens{display:flex;align-items:flex-end;min-width:max-content;gap:5px}.tok{width:110px;text-align:center;border-top:2px solid var(--accent);padding:8px 4px}.tok b{font:17px Georgia,serif}.tok small{display:block;color:var(--muted)}.dep{font:12px ui-monospace,monospace;color:var(--accent);margin-top:5px}.root{background:var(--soft)}table{border-collapse:collapse;width:100%;font-size:12px;margin-top:12px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}.more{display:block;margin:20px auto;padding:9px 15px;background:white;border:1px solid var(--accent);border-radius:6px;color:var(--accent)}@media(max-width:700px){.bar{display:block}}
</style></head><body><header><div class="bar"><b>CorBo · Universal Dependencies</b><nav><a href="./">Corpus</a> · <a href="relations.html">Relações</a> · <a href="morphemes.html">Morfemas</a></nav></div></header><main><div class="muted">ANOTAÇÃO SINTÁTICA</div><h1>Árvores de dependência</h1><p class="muted">Visualização direta de HEAD e DEPREL registrados no CoNLL-U. A página não infere nem altera relações sintáticas.</p><div class="tools"><input id="q" placeholder="Buscar texto, forma, lema, UPOS ou relação"></div><div id="status" class="muted">Carregando sentenças…</div><div id="list"></div><button id="more" class="more" hidden>Mostrar mais</button></main><script>
let D=[],limit=30;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function graph(s){const W=115,base=28,max=Math.max(1,...s.tokens.map(t=>t.head?Math.abs(t.id-t.head):0)),H=55+max*22,width=s.tokens.length*W;let arcs=s.tokens.filter(t=>t.head>0).map(t=>{let x1=(t.head-.5)*W,x2=(t.id-.5)*W,d=Math.abs(t.id-t.head),y=H-8-d*22,mid=(x1+x2)/2;return `<path d="M ${x1} ${H} C ${x1} ${y}, ${x2} ${y}, ${x2} ${H}" fill="none" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow)"/><text x="${mid}" y="${Math.max(12,y-4)}" text-anchor="middle" font-size="11" fill="var(--accent)">${esc(t.deprel)}</text>`}).join('');return `<div class="tree" style="padding-top:${H}px"><svg class="arcs" width="${width}" height="${H+8}" viewBox="0 0 ${width} ${H+8}"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="var(--accent)"/></marker></defs>${arcs}</svg><div class="tokens">${s.tokens.map(t=>`<div class="tok ${t.head===0?'root':''}"><b>${esc(t.form)}</b><small>${esc(t.lemma==='_'?'':t.lemma)}</small><small>${esc(t.upos)}</small><div class="dep">${t.head===0?'ROOT':esc(t.deprel)}</div></div>`).join('')}</div></div>`}function card(s){let toks=s.tokens.map(t=>`<div class="tok ${t.head===0?'root':''}"><b>${esc(t.form)}</b><small>${esc(t.lemma==='_'?'':t.lemma)}</small><small>${esc(t.upos)}</small><div class="dep">← ${t.head||'ROOT'} · ${esc(t.deprel)}</div></div>`).join('');let rows=s.tokens.map(t=>`<tr><td>${t.id}</td><td>${esc(t.form)}</td><td>${esc(t.lemma)}</td><td>${esc(t.upos)}</td><td>${t.head}</td><td>${esc(t.deprel)}</td></tr>`).join('');return `<section class="sentence" id="${esc(s.sent_id)}"><div class="muted">${esc(s.sent_id)}</div><div class="text">${esc(s.text)}</div>${s.text_por?`<div>${esc(s.text_por)}</div>`:''}<div class="graph">${graph(s)}</div><details><summary>CoNLL-U essencial</summary><table><tr><th>ID</th><th>FORM</th><th>LEMMA</th><th>UPOS</th><th>HEAD</th><th>DEPREL</th></tr>${rows}</table></details></section>`}function render(){let qv=q.value.trim().toLocaleLowerCase('pt-BR'),x=qv?D.filter(s=>JSON.stringify(s).toLocaleLowerCase('pt-BR').includes(qv)):D;list.innerHTML=x.slice(0,limit).map(card).join('');status.textContent=`${x.length.toLocaleString('pt-BR')} sentença(s).`;more.hidden=x.length<=limit}q.oninput=()=>{limit=30;render()};more.onclick=()=>{limit+=30;render()};fetch('data/ud-sentences.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(x=>{D=x;render()}).catch(()=>status.textContent='O índice UD ainda não foi gerado.');</script></body></html>
