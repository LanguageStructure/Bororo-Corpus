name: Gerar índices do CorBo

on:
  push:
    branches:
      - main
    paths:
      - 'CorBo_vNext/texts/**/*.tsv'
      - 'CorBo_vNext/annotations/**/*.tsv'
      - 'CorBo/Corpus_Files/*.conllu'
      - 'CorBo/Corpus_Files/**/*.conllu'
      - 'scripts/build_corpus_indexes.py'
      - 'scripts/split_gold_silver.py'
      - 'scripts/build_annotation_inventory.py'
  workflow_dispatch:

permissions:
  contents: write

# Mesmo grupo de tokenizer-model.yml: os fluxos que fazem push na main rodam um de cada vez.
concurrency:
  group: corbo-main-push
  cancel-in-progress: false

jobs:
  build-indexes:
    runs-on: ubuntu-latest
    env:
      # Tudo o que os scripts de build escrevem (inclui JSON-LD das páginas, sitemap, OLAC e downloads).
      DERIVED: >-
        docs/data docs/downloads docs/index.html docs/en.html docs/sitemap.xml docs/robots.txt docs/olac.xml
        docs/ANNOTATION_INVENTORY.md CorBo/Corpus_Files/splits CorBo/validation/feature_inventory.json
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar dados derivados
        run: |
          python scripts/build_corpus_indexes.py
          python scripts/build_annotation_inventory.py
          python scripts/split_gold_silver.py

      - name: Registrar índices gerados
        run: |
          git status --short
          if git diff --quiet -- $DERIVED && [ -z "$(git ls-files --others --exclude-standard -- $DERIVED)" ]; then
            echo "Índices já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $DERIVED
          git commit -m "Atualizar índices derivados do CorBo"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
