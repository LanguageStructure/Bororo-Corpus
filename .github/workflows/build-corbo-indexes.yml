name: Gerar índices do CorBo

on:
  push:
    branches:
      - main
    paths:
      - 'CorBo_vNext/texts/**/*.tsv'
      - 'CorBo_vNext/annotations/**/*.tsv'
      - 'CorBo/Corpus_Files/*.conllu'
      - 'CorBo/Corpus_Files/**/*.conllu'
      - 'scripts/build_corpus_indexes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerar dados derivados
        run: python scripts/build_corpus_indexes.py

      - name: Registrar índices gerados
        run: |
          if git diff --quiet -- docs/data; then
            echo "Índices já estão atualizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "Atualizar índices derivados do CorBo"
          git pull --rebase origin main
          git push origin HEAD:main
