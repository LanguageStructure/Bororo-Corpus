name: Build CorBo indexes

on:
  push:
    branches:
      - corbo-restructure-2026-09
    paths:
      - 'CorBo_vNext/texts/**/*.tsv'
      - 'scripts/build_corpus_indexes.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-indexes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: corbo-restructure-2026-09

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build derived web data
        run: python scripts/build_corpus_indexes.py

      - name: Commit generated indexes
        run: |
          if git diff --quiet -- docs/data/coqueiro-units.json docs/data/coqueiro-stats.json; then
            echo "Indexes already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/coqueiro-units.json docs/data/coqueiro-stats.json
          git commit -m "Build CorBo derived web indexes"
          git push origin HEAD:corbo-restructure-2026-09
